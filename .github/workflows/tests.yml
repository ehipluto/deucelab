name: Quality checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python tools/check_public_tree.py
      - run: python -m coverage run -m unittest discover -v
        env:
          PYTHONWARNINGS: error
      - run: python -m coverage report
      - run: deucelab --smoke
      - run: deucelab --smoke --model direct
      - run: deucelab-backtest --sets 10 --seed 42
